# CI for tee-custody (T-14; SR-9, NFR-11). Runs against the simulator only: no cloud credentials and
# no repository secrets. test/lint/coverage run framework.yaml's commands verbatim (the INC-2 strings in
# docs/tasks/INC-2/WAVES.md "Orchestrator actions"); `browser` runs the Playwright suites (TL-7).
# Every third-party action is pinned by full commit SHA; scanners run from exact pins via uvx.
# Trivy is deferred to INC-5: it scans the workload image and INC-1 builds no image (WAVES.md R-9).
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every `uv run` (including framework.yaml's commands) fails if uv.lock is out of date.
  UV_LOCKED: "1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: test_command
        run: uv run pytest -q packages/teecustody-py packages/teecustody-sim examples/notes-app/gateway tests && pnpm -r test && uv run pytest -q spec/vectors
      - name: repository-level tests
        run: uv run pytest -q tests

  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: lint_command
        # Includes semgrep, the bypass-resistant layer behind ruff and ESLint (D-028, D-038).
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy --strict packages/teecustody-py/src packages/teecustody-sim/src examples/notes-app/gateway/src && pnpm -r lint && pnpm -r typecheck && uvx semgrep==1.178.0 --config .semgrep.yml --error --metrics=off
      - name: semgrep ignore-list probe
        # .semgrepignore must not hide src/**/{tests,test,vendor,build}; the probe copies are staged
        # in this CI workspace only (semgrep scans tracked files) and never committed.
        run: |
          for d in tests test vendor build; do
            mkdir -p "packages/teecustody-py/src/teecustody/$d"
            cp .semgrep/tests/tc.tc-py-no-dynamic-import.pos.py "packages/teecustody-py/src/teecustody/$d/_semgrep_probe.py"
            git add -f "packages/teecustody-py/src/teecustody/$d/_semgrep_probe.py"
          done
          uvx semgrep==1.178.0 --config .semgrep.yml --metrics=off --json > "$RUNNER_TEMP/probe.json" || true
          python3 -c '
          import json, sys
          results = json.load(open(sys.argv[1]))["results"]
          missing = [d for d in ("tests", "test", "vendor", "build") if not any(
              r["check_id"].endswith("tc-py-no-dynamic-import")
              and r["path"] == f"packages/teecustody-py/src/teecustody/{d}/_semgrep_probe.py" for r in results)]
          print("probe paths without a finding:", missing or "none")
          sys.exit(1 if missing else 0)
          ' "$RUNNER_TEMP/probe.json"
      - name: semgrep path-scope probe
        # `semgrep --test` ignores `paths:`. Each case stages a rule's positive fixture (CI workspace
        # only, never committed) and checks the rule fires inside its scope and stays silent outside
        # it (T-05: INC-2 rules, Core rules extended to Web, test paths and teecustody_sim exempt).
        run: |
          python3 - <<'PY'
          import json, shutil, subprocess, sys
          from pathlib import Path

          PY_SRC = "packages/teecustody-py/src/teecustody/_semgrep_probe"
          SIM_SRC = "packages/teecustody-sim/src/teecustody_sim/_semgrep_probe"
          CORE_SRC = "packages/teecustody-core/src/_semgrep_probe"
          WEB_SRC = "packages/teecustody-web/src/_semgrep_probe"
          GATEWAY_SRC = "examples/notes-app/gateway/src/_semgrep_probe"
          PY_TESTS = "packages/teecustody-py/tests/_semgrep_probe"
          # (rule, fixture extension, staged directory, must fire)
          CASES = [
              ("tc-ts-no-function-constructor", "ts", WEB_SRC, True),
              ("tc-ts-no-dynamic-import", "ts", WEB_SRC, True),
              ("tc-ts-no-lint-suppression", "ts", WEB_SRC, True),
              ("tc-no-sim-anchor-in-core", "ts", WEB_SRC, True),
              ("tc-no-verification-skip", "ts", WEB_SRC, True),
              ("tc-no-sim-import-in-library", "ts", WEB_SRC, True),
              ("tc-py-hpke-import-confined", "py", PY_SRC, True),
              ("tc-py-hpke-import-confined", "py", SIM_SRC, False),
              ("tc-py-hpke-import-confined", "py", "tests/_semgrep_probe", False),
              ("tc-ts-hpke-import-confined", "ts", CORE_SRC, True),
              ("tc-ts-hpke-import-confined", "ts", WEB_SRC, True),
              ("tc-ts-hpke-import-confined", "ts", "packages/teecustody-web/test/_semgrep_probe", False),
              ("tc-py-no-hpke-seams", "py", PY_SRC, True),
              ("tc-py-no-hpke-seams", "py", GATEWAY_SRC, True),
              ("tc-py-no-hpke-seams", "py", SIM_SRC, False),
              ("tc-ts-no-hpke-seams", "ts", CORE_SRC, True),
              ("tc-ts-no-hpke-seams", "ts", WEB_SRC, True),
              ("tc-py-no-kdf-composition", "py", PY_SRC, True),
              ("tc-py-no-kdf-composition", "py", GATEWAY_SRC, True),
              ("tc-ts-no-kdf-composition", "ts", CORE_SRC, True),
              ("tc-ts-no-kdf-composition", "ts", WEB_SRC, True),
              ("tc-py-identity-sign-confined", "py", PY_SRC, True),
              ("tc-py-identity-sign-confined", "py", SIM_SRC, False),
              ("tc-py-pattern-fullmatch", "py", SIM_SRC, True),
              ("tc-py-pattern-fullmatch", "py", GATEWAY_SRC, True),
              ("tc-py-no-test-doubles", "py", PY_SRC, True),
              ("tc-py-no-test-doubles", "py", GATEWAY_SRC, True),
              # A3: next to each exclusion the rule still fires; package test trees stay silent.
              ("tc-py-hpke-import-confined", "py", "packages/teecustody-py/src/teecustody/channel", True),
              ("tc-ts-hpke-import-confined", "ts", "packages/teecustody-web/src/crypto", True),
              ("tc-py-identity-sign-confined", "py", "packages/teecustody-py/src/teecustody/channel", True),
              ("tc-py-hpke-import-confined", "py", PY_TESTS, False),
              ("tc-py-no-hpke-seams", "py", PY_TESTS, False),
              ("tc-py-identity-sign-confined", "py", PY_TESTS, False),
              ("tc-py-no-kdf-composition", "py", PY_TESTS, False),
              # T-27 A3: gateway import bans; the gateway src joins the suppression and dynamic-import bans.
              ("tc-py-gateway-banned-import", "py", GATEWAY_SRC, True),
              ("tc-py-no-lint-suppression", "py", GATEWAY_SRC, True),
              ("tc-py-no-dynamic-import", "py", GATEWAY_SRC, True),
              ("tc-py-gateway-banned-import", "py", "examples/notes-app/gateway/tests/_semgrep_probe", False),
              # T-27 A4: webcrypto.ts is not exempt from the escaped-specifier ban.
              ("tc-ts-no-escaped-specifier", "ts", "packages/teecustody-web/src/crypto", True),
          ]
          staged = {}
          for rule, ext, directory, _ in CASES:
              target = Path(directory) / f"{rule.replace('-', '_')}.{ext}"
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(f".semgrep/tests/tc.{rule}.pos.{ext}", target)
              staged[rule, directory] = str(target)
          subprocess.run(["git", "add", "-f", *staged.values()], check=True)
          scan = subprocess.run(
              ["uvx", "semgrep==1.178.0", "--config", ".semgrep.yml", "--metrics=off", "--json"],
              capture_output=True, text=True,
          )
          found = {(r["check_id"].rsplit(".", 1)[-1], r["path"]) for r in json.loads(scan.stdout)["results"]}
          wrong = [
              f"{rule} in {directory}: expected {'a finding' if fires else 'none'}"
              for rule, _, directory, fires in CASES
              if ((rule, staged[rule, directory]) in found) != fires
          ]
          print("\n".join(wrong) or "path scope as specified")
          sys.exit(1 if wrong else 0)
          PY
      - name: semgrep rule fixtures
        run: uvx semgrep==1.178.0 --test .semgrep/

  coverage:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: coverage_command
        run: uv run pytest --cov=teecustody --cov=teecustody_sim --cov=notes_gateway --cov-report=term-missing packages/teecustody-py packages/teecustody-sim examples/notes-app/gateway && pnpm -r coverage

  browser:
    # API-TL TL-7 (D-039 Q4): Playwright suites for @teecustody/web (CSP harness, PRF vault) run here,
    # not in test_command, because browser binaries are not clean-checkout runnable. It reads no
    # repository secret.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @teecustody/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @teecustody/web run test:browser

  security:
    # Also nightly, so newly published advisories and leaked-secret rules reach unchanged code.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: gitleaks (MIT binary, version and SHA-256 pinned; full history)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: pip-audit (locked Python dependencies, hash-checked)
        run: |
          uv export --locked --no-emit-workspace --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: pnpm audit
        run: pnpm audit --audit-level high
      - name: bandit (Medium and above fail)
        # Lows are already gated repo-wide by ruff's `S` rules (flake8-bandit) in lint_command, and
        # `# nosec` is banned by tc-py-no-lint-suppression, so nothing is silenced in source.
        run: uvx bandit==1.9.4 --severity-level medium -r packages/teecustody-py/src packages/teecustody-sim/src
      - name: semgrep static policy
        run: uvx semgrep==1.178.0 --config .semgrep.yml --error --metrics=off
      - name: semgrep rule fixtures
        run: uvx semgrep==1.178.0 --test .semgrep/

  deps:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - name: dependency policy (forbidden, crypto allow-list and pins, simulator separation, licence, age)
        run: uv run --locked python tools/dependency_policy.py

  fuzz:
    # SR-3 / ADR 0010: 100,000-case CBOR decoder fuzz, nightly and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: CBOR fuzz (100,000 cases)
        env:
          TEECUSTODY_CBOR_FUZZ_CASES: "100000"
        run: pnpm --filter @teecustody/core exec vitest run test/wire/cbor-fuzz.test.ts
