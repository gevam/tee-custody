[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "notes-gateway"
version = "0.1.0"
description = "Reference queue gateway for the notes-app example: an untrusted HTTP relay. Not a product."
requires-python = ">=3.12"
dependencies = ["teecustody==0.1.0", "fastapi==0.142.2", "uvicorn==0.54.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/notes_gateway"]

[tool.uv.sources]
teecustody = { workspace = true }
